<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#000"/>
<title>Radio Terrapesca</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
:root{--red:#e0241c;--red2:#ff4438;--redglow:rgba(224,36,28,.5)}
html,body{width:100%;height:100%;background:#05070c;color:#fff;font-family:'Inter',sans-serif;overflow:hidden}

/* ── Background artwork (carátula difuminada) ── */
#bgArt{
  position:fixed;inset:-60px;z-index:0;
  background-size:cover;background-position:center;
  background-image:url('https://cdn.shopify.com/s/files/1/0205/5752/9188/files/Logo-Terrapesca-01_205270e5-d546-4e33-a8d1-db0a91f1e554.png?v=1700262873');
  transition:background-image .8s ease;
  filter:blur(60px) saturate(1.5) brightness(.55);
  transform:scale(1.1);
}
#bgArt::after{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(120% 80% at 50% -10%, rgba(224,36,28,.28), transparent 55%),
    linear-gradient(to bottom,rgba(5,7,12,.35) 0%,rgba(5,7,12,.25) 35%,rgba(5,7,12,.75) 68%,rgba(5,7,12,.98) 100%);
}

/* ── Start overlay ── */
#startOverlay{
  position:fixed;inset:0;z-index:200;
  background:radial-gradient(120% 90% at 50% 0%, rgba(224,36,28,.18), transparent 60%), rgba(5,7,12,.94);
  backdrop-filter:blur(6px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  padding:40px 32px;
  transition:opacity .35s;
}
#startOverlay.hidden{opacity:0;pointer-events:none}
.so-logo img{width:96px;height:96px;border-radius:24px;object-fit:cover;
  box-shadow:0 0 60px var(--redglow),0 16px 40px rgba(0,0,0,.6);
  animation:floaty 4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.so-title{font-size:26px;font-weight:800;text-align:center;letter-spacing:-.5px}
.so-sub{font-size:13px;color:rgba(255,255,255,.55);text-align:center}
.btn-start{
  display:flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;
  border:none;border-radius:100px;
  height:58px;padding:0 34px;width:100%;max-width:300px;
  font-size:16px;font-weight:700;cursor:pointer;
  box-shadow:0 6px 30px var(--redglow);
  transition:transform .12s,filter .15s;
}
.btn-start:active{transform:scale(.96);filter:brightness(1.1)}

/* ── Full-screen player ── */
#player{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:
    max(env(safe-area-inset-top),18px)
    18px
    max(env(safe-area-inset-bottom),20px);
}

/* Marca superior: logo + RADIO TERRAPESCA */
.brand-top{text-align:center;padding-bottom:2px}
.brand-logo{width:52px;height:52px;object-fit:contain;border-radius:12px;display:inline-block}
.brand-name{font-size:11px;letter-spacing:.22em;color:rgba(255,255,255,.7);font-weight:800;margin-top:5px}

/* Píldora EN VIVO arriba */
.live-pill{
  display:inline-flex;align-items:center;gap:7px;
  background:rgba(224,36,28,.16);border:1px solid rgba(224,36,28,.4);
  color:#ff8a80;border-radius:100px;padding:5px 13px;
  font-size:10px;font-weight:700;letter-spacing:.14em;margin:10px auto 0;
  opacity:0;transition:opacity .3s;
}
.live-pill.on{opacity:1}
.live-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--red2);box-shadow:0 0 8px var(--red2);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}

/* Artwork — más chico y equilibrado vs. los productos */
.art-section{
  display:flex;align-items:center;justify-content:center;
  padding:12px 0 8px;
}
.art-thumb{
  position:relative;
  width:min(190px,46vw);height:min(190px,46vw);
  border-radius:20px;overflow:hidden;
  box-shadow:0 30px 90px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.05);
  background:#0d1017;
  flex-shrink:0;
  transition:transform .5s cubic-bezier(.22,.61,.36,1), box-shadow .5s;
}
.art-thumb.live{
  box-shadow:0 30px 90px rgba(0,0,0,.7), 0 0 60px var(--redglow), 0 0 0 1px rgba(224,36,28,.3);
}
.art-thumb.paused{transform:scale(.9)}
.art-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .4s}

/* Track info */
.info-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:0 4px;margin-bottom:16px;
}
.info-left{flex:1;min-width:0}
.track-name{font-size:15px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-artist{font-size:14px;color:rgba(255,255,255,.62);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-slogan{font-size:11px;color:rgba(255,255,255,.32);margin-top:3px;font-style:italic}
.btn-heart{width:46px;height:46px;background:rgba(255,255,255,.08);border:none;border-radius:50%;
  color:rgba(255,255,255,.7);font-size:22px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:transform .15s,background .15s,color .15s}
.btn-heart:active{transform:scale(.88)}
.btn-heart.on{color:var(--red2);background:rgba(224,36,28,.16)}

/* Progress bar */
.progress-wrap{padding:0 2px;margin-bottom:14px}
.progress-track{
  width:100%;height:5px;background:rgba(255,255,255,.16);
  border-radius:3px;position:relative;overflow:hidden;
}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--red2),var(--red));border-radius:3px;width:0%;
  transition:width .5s linear;box-shadow:0 0 10px var(--redglow)}
.progress-times{display:flex;justify-content:space-between;margin-top:7px}
.progress-times span{font-size:11px;color:rgba(255,255,255,.45);font-variant-numeric:tabular-nums}

/* Transport */
.transport{
  display:flex;align-items:center;justify-content:center;gap:34px;
  padding:0 4px;margin-bottom:22px;
}
.btn-t{background:none;border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .15s,transform .12s;padding:4px}
.btn-t:active{opacity:.6;transform:scale(.9)}
.btn-sk svg,.btn-t svg{pointer-events:none}
.btn-play-main{
  width:74px;height:74px;border-radius:50%;
  background:#fff;color:#000;border:none;
  font-size:30px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 30px rgba(0,0,0,.5);
  transition:transform .12s,background .2s,box-shadow .2s;flex-shrink:0;
}
.btn-play-main:active{transform:scale(.9)}
.btn-play-main.live{background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;box-shadow:0 8px 34px var(--redglow)}

/* Carrusel de productos — protagonista, tipo hero para celular */
.pcarousel{display:block;text-decoration:none;margin:14px 0;background:linear-gradient(160deg,rgba(224,36,28,.12),rgba(255,255,255,.03));backdrop-filter:blur(14px);border:1px solid rgba(224,36,28,.25);border-radius:22px;padding:16px;box-shadow:0 12px 44px rgba(0,0,0,.4);transition:transform .15s}
.pcarousel:active{transform:scale(.98)}
.pcar-title{font-size:11px;letter-spacing:.18em;color:var(--red2,#e0241c);margin-bottom:12px;font-weight:800}
.pcar-body{display:flex;flex-direction:column;gap:12px}
.pcar-img{width:100%;height:200px;border-radius:16px;object-fit:cover;background:rgba(255,255,255,.06);box-shadow:0 8px 26px rgba(0,0,0,.45);transition:opacity .45s}
.pcar-meta{min-width:0}
.pcar-name{color:#fff;font-weight:800;font-size:18px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;transition:opacity .45s}
.pcar-price{color:#fff;font-size:17px;margin-top:6px;font-weight:700}
.pcar-cta{display:inline-block;margin-top:11px;color:#fff;background:linear-gradient(135deg,var(--red2,#e0241c),var(--red,#b0130c));padding:10px 18px;border-radius:999px;font-size:13px;font-weight:800;box-shadow:0 6px 20px var(--redglow,rgba(224,36,28,.4))}
.pcar-fade{opacity:.12}

/* Próximas canciones */
.upnext{margin:2px 0 12px;background:rgba(255,255,255,.05);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:12px 14px}
.upnext-title{font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.5);margin-bottom:9px;font-weight:700}
.un-row{display:flex;align-items:center;gap:11px;padding:5px 0}
.un-thumb{width:38px;height:38px;border-radius:9px;object-fit:cover;flex-shrink:0;background:rgba(255,255,255,.06);box-shadow:0 3px 8px rgba(0,0,0,.4)}
.un-meta{min-width:0;flex:1}
.un-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.un-artist{font-size:11px;color:rgba(255,255,255,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.un-num{font-size:11px;color:rgba(255,255,255,.35);min-width:16px;text-align:center;font-variant-numeric:tabular-nums}

/* Status */
.status-wrap{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px;min-height:20px}
.status{font-size:11.5px;color:rgba(255,255,255,.45);letter-spacing:.04em}
.status.live{color:#4ade80}
.status.error{color:var(--red2)}
.status.connecting{color:#f5a623}

/* Bottom row */
.bottom-row{display:flex;align-items:center;justify-content:center;padding:0 4px}
.stream-pill{
  font-size:10px;color:rgba(255,255,255,.4);
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06);
  border-radius:20px;padding:6px 14px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:background .15s;
}
.stream-pill:active{background:rgba(255,255,255,.12)}

/* Viz bars */
.viz{display:inline-flex;align-items:flex-end;gap:2px;height:14px;vertical-align:middle}
.vb{width:3px;background:var(--red2);border-radius:1px}
.vb:nth-child(1){animation:bar .9s .00s ease-in-out infinite alternate}
.vb:nth-child(2){animation:bar .9s .12s ease-in-out infinite alternate}
.vb:nth-child(3){animation:bar .9s .22s ease-in-out infinite alternate}
.vb:nth-child(4){animation:bar .9s .08s ease-in-out infinite alternate}
.viz.paused .vb{animation:none;height:3px!important}
@keyframes bar{from{height:2px}to{height:12px}}
</style>
</head>
<body>

<div id="bgArt"></div>

<!-- ── Tap to start ── -->
<div id="startOverlay">
  <div class="so-logo" style="text-align:center">
    <img src="https://cdn.shopify.com/s/files/1/0205/5752/9188/files/Logo-Terrapesca-01_205270e5-d546-4e33-a8d1-db0a91f1e554.png?v=1700262873" alt="Terrapesca"/>
  </div>
  <div>
    <div class="so-title">Radio Terrapesca</div>
    <div class="so-sub" style="margin-top:6px">Terrapesca, equipa tu aventura</div>
  </div>
  <button class="btn-start" onclick="startListening()">
    <span style="font-size:20px">▶</span>
    <span>Escuchar en vivo</span>
  </button>
</div>

<!-- ── Player ── -->
<div id="player">

  <div class="brand-top">
    <img class="brand-logo" src="https://cdn.shopify.com/s/files/1/0205/5752/9188/files/Logo-Terrapesca-01_205270e5-d546-4e33-a8d1-db0a91f1e554.png?v=1700262873" alt="Terrapesca"/>
    <div class="brand-name">RADIO TERRAPESCA</div>
    <span id="topPlaylist" style="display:none"></span>
    <span id="viz" style="display:none"></span>
  </div>

  <div style="text-align:center">
    <span class="live-pill" id="livePill"><span class="dot"></span> EN VIVO</span>
  </div>
  <!-- liveLabel oculto: lo usa el JS existente para mostrar/ocultar estado en vivo -->
  <span id="liveLabel" style="display:none"></span>

  <div class="art-section">
    <div class="art-thumb paused" id="artThumb">
      <img id="artImg"
        src="https://cdn.shopify.com/s/files/1/0205/5752/9188/files/Logo-Terrapesca-01_205270e5-d546-4e33-a8d1-db0a91f1e554.png?v=1700262873"
        alt="artwork"/>
    </div>
  </div>

  <div class="info-row">
    <div class="info-left">
      <div class="track-name" id="trackName">Radio Terrapesca</div>
      <span id="trackArtist" style="display:none"></span>
    </div>
    <button class="btn-heart" id="btnHeart" onclick="toggleHeart()" title="Me gusta">♡</button>
  </div>

  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
    <div class="progress-times">
      <span id="tNow">EN VIVO</span>
      <span id="statusText" class="status connecting">Cargando...</span>
    </div>
  </div>

  <!-- Carrusel de productos reales de Terrapesca: protagonista de la página -->
  <a class="pcarousel" id="pcar" href="#" target="_blank" rel="noopener" style="display:none">
    <div class="pcar-title">🛒 EN TERRAPESCA</div>
    <div class="pcar-body">
      <img id="pcarImg" class="pcar-img" alt=""/>
      <div class="pcar-meta">
        <div class="pcar-name" id="pcarName"></div>
        <div class="pcar-price" id="pcarPrice"></div>
        <div class="pcar-cta">Ver en la tienda →</div>
      </div>
    </div>
  </a>

  <div class="bottom-row">
    <div class="stream-pill" id="streamPill" onclick="copyUrl()">🔗 Compartir</div>
  </div>

</div><!-- #player -->

<!-- Reproductor de YouTube oculto (mismo mecanismo que sucursal.html — YouTube
     bloquea reproducción en iframes 0x0/display:none, por eso 200x113 casi invisible) -->
<div id="yt-holder" style="position:fixed;bottom:0;right:0;width:200px;height:113px;opacity:.01;pointer-events:none;z-index:-1"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const TP_LOGO = 'https://cdn.shopify.com/s/files/1/0205/5752/9188/files/Logo-Terrapesca-01_205270e5-d546-4e33-a8d1-db0a91f1e554.png?v=1700262873';
const shareUrl = location.origin + '/listen';

let playing = false, started = false;
let currentTrack = null, ws = null, wsTimer = null, wsOk = false;

// Diagnóstico claro de por qué no hay sonido (listen es un RECEPTOR: necesita
// que la cabina/studio esté transmitiendo música).
function diagnose() {
  if (playing) return;
  if (!wsOk) { setStatus('Conectando con la estación…', 'connecting'); return; }
  if (currentTrack && currentTrack.ytId) return; // hay pista; el player la tomará
  setStatus('La cabina no está al aire — abre el Studio y reproduce música', 'connecting');
}

document.getElementById('streamPill').textContent = shareUrl;

/* ── Reproductor YouTube sincronizado (mismo mecanismo que sucursal.html) ──
   El audio ya no viene del stream del servidor (ytdl-core se rompe seguido);
   se reproduce el video de YouTube oculto, sincronizado por WebSocket. */
let ytPlayer = null, ytReady = false, _pendingPlay = null, _lastYtId = null;
let spotAudio = null;
// Posición "en vivo": la última posición reportada + el tiempo transcurrido
let _livePos = { pos: 0, at: 0, playing: false };
function _liveNow() {
  if (!_livePos.at) return 0;
  return _livePos.pos + (_livePos.playing ? (Date.now() - _livePos.at) / 1000 : 0);
}

function onYouTubeIframeAPIReady() {
  ytPlayer = new YT.Player('yt-holder', {
    height: '113', width: '200',
    playerVars: { autoplay: 1, controls: 0, modestbranding: 1, rel: 0, playsinline: 1 },
    events: {
      onReady: () => {
        ytReady = true;
        if (_pendingPlay && started) { const p = _pendingPlay; _pendingPlay = null; playRemote(p.track, p.pos); }
      },
      onStateChange: (e) => {
        if (e.data === YT.PlayerState.PLAYING) {
          playing = true; setPlayUI(true); setStatus('● EN VIVO', 'live');
          document.getElementById('liveLabel').style.display = '';
          document.getElementById('viz').classList.remove('paused');
        }
        if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) {
          playing = false; setPlayUI(false);
          document.getElementById('viz').classList.add('paused');
        }
      },
      onError: () => { setStatus('Video no disponible — esperando la siguiente…', 'connecting'); }
    }
  });
}

function playRemote(track, pos) {
  if (!track || !track.ytId) return;
  currentTrack = track;
  updateNowPlaying(track);
  if (!started || !ytReady) { _pendingPlay = { track, pos: pos || 0 }; return; }
  stopSpot();
  try {
    if (_lastYtId === track.ytId) {
      // Mismo video ya cargado — solo sincronizar y reanudar (sin flash desde 0)
      if ((pos || 0) > 2) try { ytPlayer.seekTo(pos, true); } catch (_) {}
      ytPlayer.playVideo();
    } else {
      _lastYtId = track.ytId;
      ytPlayer.loadVideoById({ videoId: track.ytId, startSeconds: (pos || 0) > 2 ? pos : 0 });
    }
    // Si el navegador bloqueó el autoplay, pedir un toque
    setTimeout(() => {
      try {
        if (ytPlayer.getPlayerState() !== YT.PlayerState.PLAYING) {
          setStatus('Toca ▶ para escuchar', 'connecting'); setPlayUI(false);
        }
      } catch (_) {}
    }, 2000);
  } catch (_) { _pendingPlay = { track, pos: pos || 0 }; }
}

/* Spots/DJ Rodo llegan como audio base64 — se reproducen sobre la música pausada */
function b64ToBlob(b64, type) {
  const bin = atob(b64); const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Blob([u8], { type });
}
function stopSpot() {
  if (spotAudio) {
    try { spotAudio.pause(); } catch (_) {}
    if (spotAudio._u) URL.revokeObjectURL(spotAudio._u);
    spotAudio = null;
  }
}
function playSpotB64(track) {
  if (!started) return;
  try { if (ytReady) ytPlayer.pauseVideo(); } catch (_) {}
  stopSpot();
  const url = URL.createObjectURL(b64ToBlob(track.b64, track.mime || 'audio/mpeg'));
  spotAudio = new Audio(url); spotAudio._u = url; spotAudio.volume = 0.95;
  const resume = () => {
    stopSpot();
    try {
      if (ytReady && _lastYtId) {
        const p = _liveNow();
        if (p > 2) ytPlayer.seekTo(p, true);
        ytPlayer.playVideo();
      }
    } catch (_) {}
  };
  spotAudio.onended = resume; spotAudio.onerror = resume;
  spotAudio.play().catch(() => {});
  setStatus('📣 ' + (track.name || 'Al aire'), 'live');
}

/* Progreso real de la canción */
setInterval(() => {
  if (!ytReady || !_lastYtId) return;
  let c = 0, d = 0;
  try { c = ytPlayer.getCurrentTime() || 0; d = ytPlayer.getDuration() || 0; } catch (_) { return; }
  document.getElementById('progFill').style.width = (d > 0 ? Math.min(100, c / d * 100) : 0) + '%';
  document.getElementById('tNow').textContent = d > 0 ? fmtT(c) + ' / ' + fmtT(d) : 'EN VIVO';
}, 500);
function fmtT(s) { s = Math.floor(s); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }

// ── Start overlay tap ──
function startListening() {
  if (started) return;
  started = true;
  const ov = document.getElementById('startOverlay');
  ov.classList.add('hidden');
  setTimeout(() => { ov.style.display = 'none'; }, 320);

  connectWS();
  startSWPing();
  setupMediaSessionBase();

  // Reproducir lo que esté al aire (la metadata ya llegó por WS antes del tap)
  const t = (_pendingPlay && _pendingPlay.track) || currentTrack;
  if (t && t.ytId) { _pendingPlay = null; playRemote(t, _liveNow()); }
  else diagnose();
}

// ── Controls ──
function togglePlay() {
  if (!started) { startListening(); return; }
  if (playing) {
    try { if (ytReady) ytPlayer.pauseVideo(); } catch (_) {}
    setStatus('Pausado', '');
    document.getElementById('liveLabel').style.display = 'none';
  } else if (currentTrack && currentTrack.ytId) {
    // Reanudar EN VIVO: sincronizar a la posición actual de la radio
    playRemote(currentTrack, _liveNow());
  } else {
    diagnose();
  }
}
function skipPrev() { sendWS({ type: 'PREV_TRACK' }); }
function skipNext() { sendWS({ type: 'NEXT_TRACK' }); }

function setPlayUI(p) {
  const btn = document.getElementById('btnPlay');
  if (btn) { btn.textContent = p ? '⏸' : '▶'; btn.classList.toggle('live', p); }
  document.getElementById('artThumb').classList.toggle('live', p);
  document.getElementById('artThumb').classList.toggle('paused', !p);
  document.getElementById('livePill').classList.toggle('on', p);
  document.getElementById('viz').classList.toggle('paused', !p);
}
function setStatus(msg, cls = '') {
  const el = document.getElementById('statusText');
  el.textContent = msg;
  el.className = 'status ' + cls;
}
function copyUrl() {
  navigator.clipboard?.writeText(shareUrl).then(() => {
    document.getElementById('streamPill').textContent = '✅ Copiado';
    setTimeout(() => { document.getElementById('streamPill').textContent = shareUrl; }, 2000);
  }).catch(() => {});
}

// ── MediaSession ──
function setupMediaSessionBase() {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: 'Radio Terrapesca', artist: 'Terrapesca, equipa tu aventura',
    album: 'Radio Terrapesca',
    artwork: [{ src: TP_LOGO, sizes: '512x512', type: 'image/png' }]
  });
  navigator.mediaSession.setActionHandler('play', () => { if (currentTrack?.ytId) playRemote(currentTrack, _liveNow()); });
  navigator.mediaSession.setActionHandler('pause', () => { try { if (ytReady) ytPlayer.pauseVideo(); } catch(_) {} });
  navigator.mediaSession.setActionHandler('stop', () => { try { if (ytReady) ytPlayer.pauseVideo(); } catch(_) {} });
  // Sin next/prev: los oyentes no deben mover la estación (afecta a toda la red).
  try { navigator.mediaSession.setActionHandler('nexttrack', null); } catch(_) {}
  try { navigator.mediaSession.setActionHandler('previoustrack', null); } catch(_) {}
}

// ── Carrusel de productos reales de Terrapesca (feed público, sin token) ──
let _pcarItems = [], _pcarIdx = 0, _pcarTimer = null;
async function loadProductCarousel() {
  try {
    const r = await fetch('/api/shop-feed'); const d = await r.json();
    _pcarItems = (d.products || []).filter(p => p.image && p.title);
    if (!_pcarItems.length) return;
    for (let i = _pcarItems.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = _pcarItems[i]; _pcarItems[i] = _pcarItems[j]; _pcarItems[j] = t; }
    document.getElementById('pcar').style.display = 'block';
    _pcarShow(0);
    clearInterval(_pcarTimer);
    _pcarTimer = setInterval(() => { _pcarIdx = (_pcarIdx + 1) % _pcarItems.length; _pcarShow(_pcarIdx); }, 6000);
  } catch (_) {}
}
function _pcarShow(i) {
  const p = _pcarItems[i]; if (!p) return;
  const img = document.getElementById('pcarImg'), name = document.getElementById('pcarName'),
        price = document.getElementById('pcarPrice'), a = document.getElementById('pcar');
  img.classList.add('pcar-fade'); name.classList.add('pcar-fade');
  setTimeout(() => {
    img.src = p.image; img.alt = p.title; name.textContent = p.title;
    price.textContent = p.price ? ('$' + Math.round(parseFloat(p.price)).toLocaleString('es-MX') + ' MXN') : '';
    a.href = p.url || '#';
    img.classList.remove('pcar-fade'); name.classList.remove('pcar-fade');
  }, 250);
}
loadProductCarousel();

function updateNowPlaying(track) {
  currentTrack = track;
  const name = track?.name || track?.title || 'Radio Terrapesca';
  const artist = track?.channelTitle || track?.sub || 'Radio Terrapesca';
  document.getElementById('trackName').textContent = name;
  document.getElementById('trackArtist').textContent = artist;
  document.getElementById('topPlaylist').textContent = name;

  const artSrc = track?.cover || track?.thumb || (track?.ytId ? `https://img.youtube.com/vi/${track.ytId}/hqdefault.jpg` : TP_LOGO);
  document.getElementById('artImg').src = artSrc;
  document.getElementById('artImg').onerror = () => { document.getElementById('artImg').src = TP_LOGO; };

  // Update blurred background
  document.getElementById('bgArt').style.backgroundImage = `url('${artSrc}')`;
  syncHeart();

  if ('mediaSession' in navigator) {
    const type = (track?.thumb || track?.ytId) ? 'image/jpeg' : 'image/png';
    navigator.mediaSession.metadata = new MediaMetadata({
      title: name, artist, album: 'Radio Terrapesca',
      artwork: [{ src: artSrc, sizes: '480x360', type }]
    });
    navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
  }
}

// ── WebSocket ──
function connectWS() {
  clearTimeout(wsTimer);
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
  const url = location.origin.replace('https://', 'wss://').replace('http://', 'ws://');
  try { ws = new WebSocket(url); } catch(e) { wsTimer = setTimeout(connectWS, 4000); return; }
  ws.onopen = () => { wsOk = true; if (started && !playing) diagnose(); };
  ws.onclose = () => { wsOk = false; if (started && !playing) setStatus('Reconectando con la estación…', 'connecting'); wsTimer = setTimeout(connectWS, 4000); };
  ws.onerror = () => {};
  ws.onmessage = (e) => {
    try {
      const m = JSON.parse(e.data);
      switch (m.type) {
        case 'SYNC': {
          const st = m.state || {};
          if (st.queuePreview) renderUpNext(st.queuePreview);
          if (st.currentTrack) {
            _livePos = { pos: st.position || 0, at: st.lastUpdate || Date.now(), playing: !!st.isPlaying };
            if (st.currentTrack.ytId && st.isPlaying) playRemote(st.currentTrack, _liveNow());
            else updateNowPlaying(st.currentTrack);
          }
          break;
        }
        case 'PLAY':
          if (m.track) {
            _livePos = { pos: m.position || 0, at: Date.now(), playing: true };
            if (m.track.ytId) playRemote(m.track, m.position || 0);
            else updateNowPlaying(m.track);
          }
          break;
        case 'PAUSE':
          _livePos = { pos: m.position || 0, at: Date.now(), playing: false };
          try { if (ytReady) ytPlayer.pauseVideo(); } catch (_) {}
          break;
        case 'RESUME':
          _livePos = { pos: m.position || 0, at: Date.now(), playing: true };
          if (started && currentTrack && currentTrack.ytId) playRemote(currentTrack, m.position || 0);
          break;
        case 'SPOT':
          if (m.track) {
            document.getElementById('topPlaylist').textContent = '🎙 ' + (m.track.name || 'Al aire');
            if (m.track.b64) playSpotB64(m.track);
          }
          break;
        case 'QUEUE_PREVIEW':
          renderUpNext(m.items);
          break;
      }
    } catch(_) {}
  };
}
function sendWS(d) { if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify(d)); }

// ── Próximas canciones (Fase 4) ──
function renderUpNext(items) {
  const box = document.getElementById('upnext'), list = document.getElementById('upnextList');
  if (!box || !list) return; // sección removida — ya no se muestra
  if (!Array.isArray(items) || !items.length) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  list.innerHTML = items.slice(0, 5).map((t, i) => `
    <div class="un-row">
      <span class="un-num">${i + 1}</span>
      <img class="un-thumb" src="${t.cover || ('https://img.youtube.com/vi/' + t.ytId + '/default.jpg')}" alt=""
           onerror="this.style.visibility='hidden'">
      <div class="un-meta"><div class="un-name">${escHtml(t.name || 'YouTube')}</div>
        <div class="un-artist">${escHtml(t.artist || '')}</div></div>
    </div>`).join('');
}
function escHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ── Favoritos locales del oyente (Fase 4) ──
let _likes = new Set();
try { _likes = new Set(JSON.parse(localStorage.getItem('tp_listen_likes') || '[]')); } catch(_) {}
function toggleHeart() {
  const id = currentTrack?.ytId;
  if (!id) return;
  _likes.has(id) ? _likes.delete(id) : _likes.add(id);
  localStorage.setItem('tp_listen_likes', JSON.stringify([..._likes]));
  syncHeart();
}
function syncHeart() {
  const b = document.getElementById('btnHeart');
  if (!b) return;
  const on = !!(currentTrack?.ytId && _likes.has(currentTrack.ytId));
  b.textContent = on ? '♥' : '♡';
  b.style.color = on ? '#ef4444' : '';
}

// ── Service Worker ──
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
let swPing;
function startSWPing() {
  clearInterval(swPing);
  swPing = setInterval(() => {
    navigator.serviceWorker?.ready.then(r => {
      if (r.active) { const { port1, port2 } = new MessageChannel(); r.active.postMessage('ping', [port2]); }
    }).catch(() => {});
  }, 20000);
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && playing && navigator.mediaSession) {
    navigator.mediaSession.playbackState = 'playing';
  }
});

// Conectar metadata desde el load (Fase 4): el oyente ve qué suena y las
// próximas canciones antes de pulsar "Escuchar". El audio sigue requiriendo el tap.
connectWS();
</script>
