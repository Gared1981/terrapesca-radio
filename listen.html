<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0a1628"/>
<title>Radio Terrapesca</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a1628;--navy:#0d1e38;--navy2:#122040;--accent:#3b82f6;--red:#ef4444;
  --text1:#e2e8f0;--text2:#94a3b8;--text3:#4a6080;--border:#1a3254;--green:#10b981;
}

html,body{
  width:100%;height:100%;
  background:var(--bg);
  color:var(--text1);
  font-family:'Inter',sans-serif;
  overflow:hidden;
  -webkit-overflow-scrolling:touch;
}

/* ── Full-screen wrapper ── */
#app{
  width:100%;height:100%;
  display:flex;flex-direction:column;
  padding:
    max(env(safe-area-inset-top),20px)
    max(env(safe-area-inset-right),20px)
    max(env(safe-area-inset-bottom),24px)
    max(env(safe-area-inset-left),20px);
}

/* ── Start overlay ── */
#startOverlay{
  position:fixed;inset:0;z-index:100;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  padding:40px 28px;
  transition:opacity .35s ease;
}
#startOverlay.hidden{opacity:0;pointer-events:none}

.start-logo img{
  width:96px;height:96px;border-radius:22px;
  object-fit:cover;
  box-shadow:0 0 0 1px rgba(59,130,246,.3),0 8px 40px rgba(59,130,246,.25);
}
.start-brand{margin-top:10px;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.25em;color:var(--text3);text-align:center;text-transform:uppercase}
.start-title{font-size:24px;font-weight:800;color:var(--text1);text-align:center;line-height:1.25}
.start-slogan{font-size:13px;color:var(--text2);text-align:center;letter-spacing:.02em}

.btn-start{
  display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--accent);color:#fff;
  border:none;border-radius:100px;
  padding:0 36px;height:60px;width:100%;max-width:320px;
  font-size:17px;font-weight:700;font-family:'Inter',sans-serif;
  cursor:pointer;
  box-shadow:0 0 0 0 rgba(59,130,246,.6);
  animation:glow 2.4s ease-in-out infinite;
  transition:transform .12s,background .2s;
}
.btn-start:active{transform:scale(.96);animation:none;background:#2563eb}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.5)}50%{box-shadow:0 0 0 12px rgba(59,130,246,.0)}}

.start-hint{font-size:11px;font-family:'Share Tech Mono',monospace;color:var(--text3);text-align:center}

/* ── Player layout ── */
.player{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:space-between;
  max-width:420px;width:100%;margin:0 auto;
}

/* Header row */
.player-header{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  padding-bottom:8px;
}
.station-name{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.18em;color:var(--text3);text-transform:uppercase}
.np-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:9px;font-family:'Share Tech Mono',monospace;
  padding:3px 9px;border-radius:20px;
  background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:#ef4444;
}
.np-badge .dot{width:5px;height:5px;border-radius:50%;background:#ef4444;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Artwork */
.artwork-section{flex:1;display:flex;align-items:center;justify-content:center;width:100%;padding:12px 0}
.artwork-wrap{
  position:relative;
  width:min(260px,60vw);height:min(260px,60vw);
  border-radius:20px;overflow:hidden;
  background:var(--navy2);
  box-shadow:0 16px 60px rgba(0,0,0,.55);
}
.artwork-wrap img{width:100%;height:100%;object-fit:cover;transition:opacity .4s}
.artwork-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 55%,rgba(10,22,40,.65));pointer-events:none}

/* Track info */
.track-section{width:100%;text-align:center;padding:0 8px}
.track-title{
  font-size:18px;font-weight:700;color:var(--text1);line-height:1.3;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  margin-bottom:4px;
}
.track-sub{font-size:13px;color:var(--text2);margin-bottom:2px}
.track-slogan{font-size:11px;color:var(--text3);font-style:italic;margin-top:2px}

/* Visualizer */
.viz{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:20px;margin:8px 0}
.vb{width:3px;background:var(--accent);border-radius:2px;opacity:.65}
.vb:nth-child(1){animation:bar .9s .00s ease-in-out infinite alternate}
.vb:nth-child(2){animation:bar .9s .12s ease-in-out infinite alternate}
.vb:nth-child(3){animation:bar .9s .22s ease-in-out infinite alternate}
.vb:nth-child(4){animation:bar .9s .17s ease-in-out infinite alternate}
.vb:nth-child(5){animation:bar .9s .06s ease-in-out infinite alternate}
.vb:nth-child(6){animation:bar .9s .09s ease-in-out infinite alternate}
.vb:nth-child(7){animation:bar .9s .19s ease-in-out infinite alternate}
.viz.paused .vb{animation:none;height:3px!important}
@keyframes bar{from{height:3px}to{height:18px}}

/* Controls */
.controls-section{width:100%;padding-bottom:8px}

.transport{display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:20px}
.btn-sk{
  width:52px;height:52px;border-radius:50%;
  background:var(--navy2);border:1px solid var(--border);color:var(--text2);
  font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .2s,transform .12s;
  user-select:none;
}
.btn-sk:active{border-color:var(--accent);transform:scale(.9)}
.btn-play{
  width:76px;height:76px;border-radius:50%;
  background:var(--accent);border:none;color:#fff;font-size:30px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform .12s,background .2s;
  box-shadow:0 4px 28px rgba(59,130,246,.5);
  user-select:none;
}
.btn-play:active{transform:scale(.91)}
.btn-play.playing{background:#ef4444;box-shadow:0 4px 28px rgba(239,68,68,.5)}

.vol-row{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:14px}
.vol-icon{font-size:16px;color:var(--text3);flex-shrink:0}
input[type=range]{
  flex:1;-webkit-appearance:none;height:6px;border-radius:3px;
  background:var(--border);outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:24px;height:24px;border-radius:50%;
  background:var(--accent);cursor:pointer;
  box-shadow:0 0 8px rgba(59,130,246,.5);
}

/* Footer */
.player-footer{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px}
.status{font-size:11px;font-family:'Share Tech Mono',monospace;color:var(--text3);text-align:center}
.status.live{color:var(--green)}
.status.error{color:#ef4444}
.status.connecting{color:#f59e0b}
.stream-url{
  font-size:9px;font-family:'Share Tech Mono',monospace;color:var(--text3);
  background:var(--navy2);border:1px solid var(--border);
  border-radius:8px;padding:5px 12px;width:100%;text-align:center;
  word-break:break-all;cursor:pointer;
}
</style>
</head>
<body>

<!-- ── Tap-to-start overlay ── -->
<div id="startOverlay">
  <div class="start-logo" style="text-align:center">
    <img src="https://cdn.shopify.com/s/files/1/0205/5752/9188/files/Logo-Terrapesca-01_205270e5-d546-4e33-a8d1-db0a91f1e554.png?v=1700262873" alt="Terrapesca"/>
    <div class="start-brand">📻 Radio Terrapesca</div>
  </div>
  <div style="text-align:center">
    <div class="start-title">La radio oficial de Terrapesca</div>
    <div class="start-slogan" style="margin-top:6px">Equipa tu aventura</div>
  </div>
  <button class="btn-start" onclick="startListening()">
    <span style="font-size:22px">▶</span>
    <span>Escuchar Radio Terrapesca</span>
  </button>
  <div class="start-hint">Toca para comenzar la transmisión en vivo</div>
</div>

<!-- ── Full-screen player ── -->
<div id="app">
  <div class="player">

    <!-- Header -->
    <div class="player-header">
      <div class="station-name">📻 Radio Terrapesca</div>
      <div class="np-badge" id="liveBadge" style="display:none">
        <span class="dot"></span> EN VIVO
      </div>
    </div>

    <!-- Artwork -->
    <div class="artwork-section">
      <div class="artwork-wrap">
        <img id="artworkImg"
          src="https://cdn.shopify.com/s/files/1/0205/5752/9188/files/Logo-Terrapesca-01_205270e5-d546-4e33-a8d1-db0a91f1e554.png?v=1700262873"
          alt="Radio Terrapesca"/>
        <div class="artwork-overlay"></div>
      </div>
    </div>

    <!-- Track info -->
    <div class="track-section">
      <div class="track-title" id="npTitle">Radio Terrapesca</div>
      <div class="track-sub" id="npSub">Música, pesca, marina y outdoor</div>
      <div class="track-slogan">Terrapesca, equipa tu aventura</div>
      <div class="viz" id="viz">
        <div class="vb" style="height:6px"></div>
        <div class="vb" style="height:12px"></div>
        <div class="vb" style="height:16px"></div>
        <div class="vb" style="height:10px"></div>
        <div class="vb" style="height:18px"></div>
        <div class="vb" style="height:8px"></div>
        <div class="vb" style="height:14px"></div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls-section">
      <div class="transport">
        <button class="btn-sk" onclick="skipPrev()">⏮</button>
        <button class="btn-play" id="btnPlay" onclick="togglePlay()">▶</button>
        <button class="btn-sk" onclick="skipNext()">⏭</button>
      </div>

      <div class="vol-row">
        <span class="vol-icon">🔈</span>
        <input type="range" id="volSlider" min="0" max="100" value="90" oninput="setVol(this.value)"/>
        <span class="vol-icon">🔊</span>
      </div>
    </div>

    <!-- Footer -->
    <div class="player-footer">
      <div class="status connecting" id="statusText">Conectando...</div>
      <div class="stream-url" id="streamUrl" onclick="copyUrl()">—</div>
    </div>

  </div><!-- .player -->
</div><!-- #app -->

<audio id="radioAudio" preload="none" playsinline x-webkit-airplay="allow" webkit-playsinline="true"></audio>

<script>
const TP_LOGO = 'https://cdn.shopify.com/s/files/1/0205/5752/9188/files/Logo-Terrapesca-01_205270e5-d546-4e33-a8d1-db0a91f1e554.png?v=1700262873';
const audio = document.getElementById('radioAudio');
const streamSrc = location.origin + '/radio/stream';
let playing = false, started = false, currentTrack = null;
let ws = null, wsReconnectTimer = null;

document.getElementById('streamUrl').textContent = streamSrc;
audio.volume = 0.9;

// ── Audio events ──
audio.addEventListener('playing', () => {
  playing = true;
  setPlayUI(true);
  setStatus('● EN VIVO', 'live');
  document.getElementById('liveBadge').style.display = 'inline-flex';
});
audio.addEventListener('waiting', () => setStatus('Cargando...', 'connecting'));
audio.addEventListener('stalled', () => {
  setStatus('Cargando...', 'connecting');
  // On stall, reload stream after short delay
  setTimeout(() => { if (!playing) reconnectAudio(); }, 4000);
});
audio.addEventListener('error', () => {
  setStatus('Reintentando...', 'error');
  setTimeout(reconnectAudio, 3000);
});
audio.addEventListener('pause', () => {
  playing = false;
  setPlayUI(false);
  document.getElementById('liveBadge').style.display = 'none';
  if (started) setStatus('Pausado', '');
});

function reconnectAudio() {
  if (!started) return;
  _playRetries = 0;
  doPlay();
}

// ── First tap — only called from user gesture ──
function startListening() {
  if (started) return;
  started = true;

  const overlay = document.getElementById('startOverlay');
  overlay.classList.add('hidden');
  setTimeout(() => { overlay.style.display = 'none'; }, 380);

  connectWS();
  startSWPing();
  setupMediaSessionBase();
  doPlay();
}

let _playRetries = 0;
function doPlay() {
  setStatus('Cargando...', 'connecting');
  // Always set a fresh URL to avoid cached/stale state
  audio.src = streamSrc + '?t=' + Date.now();
  const p = audio.play();
  if (p && p.catch) {
    p.catch(err => {
      // NotAllowedError = browser blocked (shouldn't happen here, we have gesture)
      // AbortError = load() was called before play() resolved — retry once
      if (_playRetries < 3) {
        _playRetries++;
        setTimeout(doPlay, 1500);
      } else {
        setStatus('Sin señal — reintentando...', 'error');
        _playRetries = 0;
        setTimeout(doPlay, 5000);
      }
    });
  }
}

// ── Controls ──
function togglePlay() {
  if (!started) { startListening(); return; }
  if (audio.paused) {
    _playRetries = 0;
    doPlay();
  } else {
    audio.pause();
  }
}
function setVol(v) { audio.volume = v / 100; }
function skipPrev() { sendWS({ type: 'PREV_TRACK' }); }
function skipNext() { sendWS({ type: 'NEXT_TRACK' }); }

function setPlayUI(p) {
  document.getElementById('btnPlay').textContent = p ? '⏸' : '▶';
  document.getElementById('btnPlay').classList.toggle('playing', p);
  document.getElementById('viz').classList.toggle('paused', !p);
}
function setStatus(msg, cls = '') {
  const el = document.getElementById('statusText');
  el.textContent = msg;
  el.className = 'status ' + cls;
}
function copyUrl() {
  navigator.clipboard?.writeText(streamSrc).then(() => {
    document.getElementById('streamUrl').textContent = '✅ Copiado!';
    setTimeout(() => document.getElementById('streamUrl').textContent = streamSrc, 2000);
  }).catch(() => {});
}

// ── MediaSession ──
function setupMediaSessionBase() {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: 'Radio Terrapesca',
    artist: 'Terrapesca, equipa tu aventura',
    album: 'Radio Terrapesca',
    artwork: [{ src: TP_LOGO, sizes: '512x512', type: 'image/png' }]
  });
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('stop', () => audio.pause());
  navigator.mediaSession.setActionHandler('nexttrack', skipNext);
  navigator.mediaSession.setActionHandler('previoustrack', skipPrev);
}
function setupMediaSession(track) {
  if (!('mediaSession' in navigator)) return;
  const title = track?.name || track?.title || 'Radio Terrapesca';
  const artist = track?.channelTitle || track?.sub || 'Radio Terrapesca';
  const artSrc = track?.thumb || (track?.ytId ? `https://img.youtube.com/vi/${track.ytId}/hqdefault.jpg` : TP_LOGO);
  const type = (track?.thumb || track?.ytId) ? 'image/jpeg' : 'image/png';
  navigator.mediaSession.metadata = new MediaMetadata({
    title, artist,
    album: 'Radio Terrapesca',
    artwork: [{ src: artSrc, sizes: '480x360', type }]
  });
  navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
}

// ── Now Playing ──
function updateNowPlaying(track) {
  currentTrack = track;
  const title = track?.name || track?.title || 'Radio Terrapesca';
  const sub = track?.channelTitle || track?.sub || 'Música, pesca, marina y outdoor';
  document.getElementById('npTitle').textContent = title;
  document.getElementById('npSub').textContent = sub;
  const img = document.getElementById('artworkImg');
  if (track?.thumb) {
    img.src = track.thumb;
    img.onerror = () => { img.src = track.ytId ? `https://img.youtube.com/vi/${track.ytId}/hqdefault.jpg` : TP_LOGO; };
  } else if (track?.ytId) {
    img.src = `https://img.youtube.com/vi/${track.ytId}/hqdefault.jpg`;
    img.onerror = () => { img.src = TP_LOGO; };
  } else {
    img.src = TP_LOGO;
  }
  setupMediaSession(track);
}

// ── WebSocket ──
function connectWS() {
  clearTimeout(wsReconnectTimer);
  const wsUrl = location.origin.replace('https://', 'wss://').replace('http://', 'ws://');
  try { ws = new WebSocket(wsUrl); } catch(e) { scheduleWSReconnect(); return; }
  ws.onopen = () => { if (playing) setStatus('● EN VIVO', 'live'); };
  ws.onclose = () => scheduleWSReconnect();
  ws.onerror = () => {};
  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'SYNC' && msg.state?.currentTrack) updateNowPlaying(msg.state.currentTrack);
      else if ((msg.type === 'PLAY' || msg.type === 'SPOT') && msg.track) updateNowPlaying(msg.track);
      else if (msg.type === 'PAUSE' && navigator.mediaSession) navigator.mediaSession.playbackState = 'paused';
      else if (msg.type === 'RESUME' && navigator.mediaSession) navigator.mediaSession.playbackState = 'playing';
    } catch(_) {}
  };
}
function scheduleWSReconnect() { wsReconnectTimer = setTimeout(connectWS, 4000); }
function sendWS(data) { if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify(data)); }

// ── Service Worker ──
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

let swKeepAlive;
function startSWPing() {
  clearInterval(swKeepAlive);
  swKeepAlive = setInterval(() => {
    navigator.serviceWorker?.ready.then(reg => {
      if (reg.active) {
        const { port1, port2 } = new MessageChannel();
        reg.active.postMessage('ping', [port2]);
      }
    }).catch(() => {});
  }, 20000);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden && playing && navigator.mediaSession)
    navigator.mediaSession.playbackState = 'playing';
});
</script>
</body>
</html>
