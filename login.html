<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#04060c"/>
<title>Acceso · Radio Terrapesca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04060c; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --glass:rgba(255,255,255,.045); --red:#e0241c; --grn:#1fd65b;
  --txt:#e8eef7; --txt2:#8fa4bd; --txt3:#4a6280;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:24px;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(1000px 560px at 15% -12%,rgba(224,36,28,.14),transparent 60%),
  radial-gradient(900px 520px at 105% 8%,rgba(39,198,224,.08),transparent 60%),
  radial-gradient(800px 600px at 50% 118%,rgba(123,77,214,.09),transparent 60%)}
.card{position:relative;z-index:1;width:min(400px,94vw);
  background:var(--glass);backdrop-filter:blur(20px) saturate(1.3);
  border:1px solid var(--line);border-radius:22px;padding:38px 30px 32px;
  box-shadow:0 24px 70px rgba(0,0,0,.55);text-align:center}
.logo{height:50px;margin-bottom:22px;filter:drop-shadow(0 8px 24px rgba(0,0,0,.5))}
h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
h1 span{color:var(--red)}
.sub{margin-top:8px;color:var(--txt2);font-size:13.5px;line-height:1.5}
form{margin-top:26px;display:flex;flex-direction:column;gap:14px;text-align:left}
label{font-size:12px;color:var(--txt2);font-weight:600;letter-spacing:.3px;margin-bottom:6px;display:block;text-transform:uppercase}
input{width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--line2);
  background:rgba(0,0,0,.35);color:var(--txt);font-size:15px;font-family:inherit;outline:none;transition:border .15s,box-shadow .15s}
input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(224,36,28,.18)}
button{margin-top:6px;width:100%;padding:14px;border:none;border-radius:12px;cursor:pointer;
  background:linear-gradient(135deg,#ff3d2e,#e0241c 55%,#b01212);color:#fff;font-size:15.5px;font-weight:700;
  letter-spacing:.3px;font-family:inherit;transition:filter .15s,transform .1s}
button:hover{filter:brightness(1.08)}
button:active{transform:scale(.985)}
button:disabled{opacity:.6;cursor:default}
.msg{margin-top:14px;font-size:13.5px;min-height:18px;line-height:1.4}
.msg.err{color:#ff6b60}
.msg.ok{color:var(--grn)}
.foot{margin-top:20px;font-size:11.5px;color:var(--txt3);line-height:1.5}
</style>
</head>
<body>
  <div class="card">
    <img class="logo" alt="Terrapesca"
      src="https://cdn.shopify.com/s/files/1/0205/5752/9188/files/Logo-Terrapesca-01_205270e5-d546-4e33-a8d1-db0a91f1e554.png?v=1700262873">
    <h1>Radio <span>Terrapesca</span></h1>
    <p class="sub">Acceso al panel interno. Ingresa tus credenciales para continuar.</p>
    <form id="loginForm" autocomplete="off">
      <div>
        <label for="user">Usuario</label>
        <input id="user" name="user" type="text" autocapitalize="characters" autocomplete="username" required>
      </div>
      <div>
        <label for="pass">Contraseña</label>
        <input id="pass" name="pass" type="password" autocomplete="current-password" required>
      </div>
      <button id="btn" type="submit">Entrar</button>
    </form>
    <div class="msg" id="msg"></div>
    <p class="foot">¿Solo quieres escuchar la radio?<br><a href="/listen" style="color:var(--txt2)">Abrir la radio pública →</a></p>
  </div>
<script>
(function(){
  var form=document.getElementById('loginForm');
  var btn=document.getElementById('btn');
  var msg=document.getElementById('msg');
  // Destino tras iniciar sesión: ?next=/studio (validado como ruta interna) o /studio por defecto.
  function nextUrl(){
    try{
      var n=new URLSearchParams(location.search).get('next');
      if(n && /^\/[A-Za-z0-9\/_\-]*$/.test(n) && n!=='/login') return n;
    }catch(_){}
    return '/';
  }
  form.addEventListener('submit', async function(e){
    e.preventDefault();
    msg.className='msg'; msg.textContent='';
    btn.disabled=true; btn.textContent='Entrando…';
    try{
      var r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({user:document.getElementById('user').value.trim(),pass:document.getElementById('pass').value})});
      var j=await r.json().catch(function(){return{};});
      if(r.ok && j.ok){
        msg.className='msg ok'; msg.textContent='¡Bienvenido! Redirigiendo…';
        location.href=nextUrl();
      }else{
        msg.className='msg err'; msg.textContent=(j&&j.error)||'Usuario o contraseña incorrectos';
        btn.disabled=false; btn.textContent='Entrar';
      }
    }catch(err){
      msg.className='msg err'; msg.textContent='No se pudo conectar. Intenta de nuevo.';
      btn.disabled=false; btn.textContent='Entrar';
    }
  });
})();
</script>
</body>
</html>
